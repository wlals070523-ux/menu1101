<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음 쿡쿡 요리단</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFFBE6; --paper:#FFFFFF; --green:#00A67E; --green-d:#007a5d; --green-l:#D9F4EA;
  --yellow:#FFD84D; --yellow-l:#FFF3B8; --orange:#F47A20; --red:#E5484D; --pink:#FF8FAB;
  --blue:#4DA3E8; --purple:#8C6FD6; --ink:#33291F; --ink2:#6B5E52; --line:#E9DFC8;
  --r:18px; --shadow:0 6px 0 rgba(0,0,0,.08),0 10px 24px rgba(80,60,20,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);
  font-family:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  overscroll-behavior:none}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--green);color:#fff;
  position:relative;z-index:5;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;pointer-events:none;
  background:radial-gradient(circle at 12px 0,var(--green) 11px,transparent 12px) 0 0/24px 12px repeat-x}
.top .logo{font-family:'Jua',sans-serif;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn{background:var(--yellow);color:var(--ink);padding:10px 18px;border-radius:14px;font-family:'Jua',sans-serif;font-size:18px;
  box-shadow:0 4px 0 #D9A91E;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9A91E}
.btn.g{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.g:active{box-shadow:0 1px 0 var(--green-d)}
.btn.w{background:#fff;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{font-size:15px;padding:7px 12px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);font-size:18px;color:#fff}
#stage{flex:1;position:relative;overflow:hidden;margin-top:12px}
.screen{position:absolute;inset:0;overflow:auto;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;background:var(--green-l);color:var(--green-d)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;
  z-index:60;font-size:16px;box-shadow:var(--shadow);animation:fadein .25s}
.modal-bg{position:fixed;inset:0;background:rgba(40,30,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;animation:fadein .2s}
.modal{background:var(--cream);border-radius:24px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{font-size:26px;color:var(--green-d);margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hint{color:var(--ink2);font-size:15px}
input[type=text],textarea{border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;width:100%;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--green)}
textarea{resize:none;min-height:70px}
/* quest layout */
.quest{display:flex;flex-direction:column;height:100%}
.q-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.q-head h2{font-size:24px;color:var(--green-d)}
.q-body{flex:1;overflow:auto;padding:4px 14px 18px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-size:17px;line-height:1.45;box-shadow:3px 4px 0 rgba(0,0,0,.12)}
.bubble.think{border-style:dashed;border-radius:30px;background:var(--yellow-l)}
.stepbar{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}
.stepbar i{width:34px;height:8px;border-radius:8px;background:var(--line)}
.stepbar i.on{background:var(--green)}
.stars{color:#E9A100;letter-spacing:2px}
.offline{background:linear-gradient(135deg,#FFF3B8,#FFE08A);border:3px dashed #D9A91E;border-radius:20px;padding:14px 16px}
.offline b{font-family:'Jua',sans-serif;font-size:20px}
.flex-c{display:flex;flex-direction:column;align-items:center}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tab-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab-bar button{padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-family:'Jua',sans-serif}
.tab-bar button.on{background:var(--green);border-color:var(--green);color:#fff}
.timer-chip{background:rgba(255,255,255,.95);color:var(--green-d);font-family:'Jua',sans-serif}
.timer-chip.low{background:var(--orange);color:#fff;animation:bob 1s infinite}
@media(max-width:700px){.top .logo{font-size:18px}.btn{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* ===== quest-specific ===== */
.start{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(circle at 20% 20%,#D9F4EA,transparent 50%),radial-gradient(circle at 85% 80%,#FFF3B8,transparent 50%),var(--cream)}
.startcard{max-width:560px;width:100%}
.wx{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:16px;background:#fff;border:3px solid var(--line);min-width:72px}
.wx.on{border-color:var(--green);background:var(--green-l);transform:translateY(-3px)}
/* world */
.world{position:absolute;inset:0;display:flex;flex-direction:column}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:0}
.mapbg,.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.node .lan{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 6px 0 rgba(0,0,0,.14),0 0 0 8px rgba(255,255,255,.4);animation:bob 3s ease-in-out infinite}
.node:nth-child(odd) .lan{animation-delay:-1s}
.node .lbl{background:rgba(255,255,255,.92);border-radius:999px;padding:3px 12px;font-family:'Jua',sans-serif;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.1);white-space:nowrap}
.node.done .lan{background:#FFE9A8;box-shadow:0 0 28px 8px rgba(255,200,60,.8)}
.node.off{opacity:.55;filter:grayscale(.7)}
.node:hover .lan{transform:scale(1.08)}
.guide{position:absolute;left:10px;bottom:6px;z-index:1;pointer-events:none}
.worldbar{flex:0 0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;background:var(--cream);border-top:4px solid var(--green-l)}
@media(max-width:700px){.node .lan{width:56px;height:56px;font-size:26px}.node .lbl{font-size:13px;padding:2px 8px}.guide{display:none}}
/* common */
.q1grid,.q2grid,.q3grid,.q4grid,.q5grid{display:grid;gap:12px;max-width:1180px;margin:0 auto;align-items:start}
.q1grid{grid-template-columns:minmax(220px,1fr) minmax(220px,1.1fr) minmax(220px,1fr)}
.q2grid,.q3grid{grid-template-columns:1fr 1fr}
.q4grid,.q5grid{grid-template-columns:1.1fr 1fr}
.q1grid.res{grid-template-columns:1fr 1fr}
@media(max-width:900px){.q1grid,.q2grid,.q3grid,.q4grid,.q5grid,.q1grid.res{grid-template-columns:1fr}}
/* q1 */
.q1read{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.q1read li{background:#FFFBE6;border-radius:12px;padding:6px 10px;font-size:16px;line-height:1.4}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;margin-right:6px;font-size:13px;font-family:'Jua',sans-serif}
.gbar{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;transition:width .3s}
.q1center{display:grid;gap:8px;justify-items:center}
.skwrap{position:relative;width:100%;max-width:300px;height:480px;background:linear-gradient(#fff,#FFF3D6);border-radius:20px;border:3px solid var(--line);overflow:hidden}
.skewer{z-index:1;position:absolute;left:50%;bottom:34px;width:92px;margin-left:-46px;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;height:410px}
.skewer .rod{position:absolute;left:50%;top:6px;bottom:-12px;width:7px;margin-left:-3.5px;background:#C79A5B;border-radius:4px;z-index:0}
.skewer .tip{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:16px solid #C79A5B;margin-top:0;z-index:0}
.stackcol{position:relative;z-index:1;margin-top:auto;margin-bottom:6px;display:flex;flex-direction:column;align-items:center;padding:4px 10px;border-radius:14px;min-height:120px;justify-content:flex-end;width:100%}
.stackcol.hot{background:rgba(0,166,126,.12);outline:3px dashed var(--green)}
.stand{z-index:0;position:absolute;left:50%;bottom:0;width:150px;height:36px;margin-left:-75px;background:#8E6B4A;border-radius:12px 12px 0 0}
.fellmsg{position:absolute;left:10px;right:10px;top:10px;background:#FFE7E7;border:2px solid var(--red);border-radius:12px;padding:8px 10px;font-size:15px}
.sp-piece{cursor:grab;touch-action:none;margin:-8px 0;transition:transform .15s}
.sp-piece.sel{filter:drop-shadow(0 0 6px var(--green))}
.ghost{position:fixed;pointer-events:none;z-index:80;transform:translate(-50%,-50%) scale(1.15);opacity:.9}
.trayitems{display:grid;gap:6px;margin-top:6px}
.tp{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;cursor:grab;touch-action:none;font-size:15px;line-height:1.35;user-select:none}
.tp.used{opacity:.35}
.grillpan{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:#3B322C;border-radius:20px;padding:16px;min-height:200px}
.fl{display:flex;gap:2px;justify-content:center}
.fl span{animation:bob .8s ease-in-out infinite}
.grillsk{display:flex;gap:2px;align-items:center;padding:8px 14px;border-radius:30px;background:#F2D9A0}
.grillsk.golden{background:#E3A93A}.grillsk.half{background:#F3EAD3}.grillsk.burnt{background:#3A2A22;filter:brightness(.8)}
.resstack{display:grid;gap:4px}.rs{display:flex;gap:8px;align-items:center;font-size:15px}
/* q2 */
.ings{display:flex;flex-wrap:wrap;gap:8px}
.ing{padding:8px 12px;border-radius:999px;border:3px solid var(--c,var(--line));background:#fff;font-family:'Jua',sans-serif;font-size:17px}
.ing.on{background:var(--c);color:#fff}
.temp{padding:8px 14px;border-radius:12px;border:3px solid var(--c,var(--line));background:#fff;font-family:'Jua',sans-serif}
.temp.on{background:var(--c);color:#fff}
.meter{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;background:var(--green);transition:width .4s}
.mix .liq{transition:all .5s}
.bub{animation:bob 1.2s infinite}
/* q3 */
.decor{font-size:28px;letter-spacing:6px}.decor.off{opacity:.3}
.needs{display:grid;gap:4px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.dish{padding:8px;border-radius:14px;border:3px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.dish.on{border-color:var(--orange);background:#FFF1DF}
.sauce{padding:7px 12px;border-radius:999px;border:3px solid var(--line);background:#fff;font-family:'Jua',sans-serif;font-size:16px}
.sauce.on{border-color:var(--green);background:var(--green-l)}
.rxcard{background:#fff;border:4px dashed var(--orange);border-radius:20px;padding:18px;text-align:center}
/* q4 */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.slot{min-height:84px;border-radius:16px;border:3px dashed var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Jua',sans-serif;font-size:19px}
.slot.sel{border-color:var(--green);background:var(--green-l)}
.slot.fill{border-style:solid;border-color:var(--c);background:var(--c);color:#fff}
.slot.pulse{animation:pop .35s}
.sliders{display:grid;gap:4px;width:100%}.sliders label{display:flex;gap:8px;align-items:center}.sliders input{flex:1}
.ingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.snd{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;padding:8px;border-radius:14px;background:#fff;border:3px solid var(--c);font-size:13px;color:var(--ink2)}
.snd b{font-family:'Jua',sans-serif;font-size:18px;color:var(--ink)}
.snd:active{background:var(--c)}
/* q5 */
.plwrap{width:min(100%,400px);aspect-ratio:1}
.pit{cursor:grab}
.seas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.se{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:3px solid var(--line);background:#fff;font-size:12px;line-height:1.2;text-align:center}
.se.on{border-color:var(--c);background:#FFFBE6}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--line)}
.selbar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:110px;width:100%}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-auto-rows:40px;gap:4px;align-items:center}
.arrow{padding:0;height:40px;font-size:18px;touch-action:none}
/* q6 */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:1100px;margin:0 auto 12px}
.dcard{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow);display:grid;gap:8px;align-content:start}
.heart{padding:6px 12px;border-radius:999px;border:2px solid var(--pink);background:#fff;font-family:'Jua',sans-serif}
.heart.on{background:var(--pink);color:#fff}
.q6share{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:900px;margin:0 auto 12px}
@media(max-width:800px){.q6share{grid-template-columns:1fr}}
.pick{font-size:14px}

input[type=range]{accent-color:var(--green)}
.offline{margin:12px auto;max-width:900px}
[hidden]{display:none!important}
.calm *,.calm *::before{animation:none!important;transition:none!important}
.btn.big{font-size:24px;padding:12px 34px}
.keys{display:flex;gap:2px;font-size:20px;background:rgba(0,0,0,.18);border-radius:999px;padding:3px 10px}
.keys span{filter:grayscale(1) brightness(1.6);opacity:.55}.keys span.on{filter:none;opacity:1;text-shadow:0 0 8px #FFE27A}
.keys.big{background:var(--green-l);font-size:34px;padding:6px 16px}.keys.big span{filter:grayscale(1);}.keys.big span.on{filter:none}
.round{position:relative;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.15);overflow:hidden;user-select:none;touch-action:none}
.round small{font-size:10px;margin-top:1px}.round .ico{font-size:20px}
.round .ring{position:absolute;inset:0;background:conic-gradient(var(--orange) 0deg,transparent 0deg);opacity:0}
.round.hold .ring{opacity:.5;animation:ringfill 3s linear forwards}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ringfill{from{background:conic-gradient(var(--orange) 0deg,transparent 0deg)}to{background:conic-gradient(var(--orange) 360deg,transparent 360deg)}}
.tg{width:56px;height:32px;border-radius:999px;background:#CFC7D8;position:relative;flex:0 0 auto;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:#1FC890}.tg.on i{left:27px}
.trow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:2px dashed var(--line)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.hgrid{grid-template-columns:1fr}}
.hcard{background:#fff;border-radius:16px;padding:12px 14px}.hcard p{margin:4px 0 0;line-height:1.5;color:var(--ink2)}
.av{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:18px;background:#fff;border:4px solid var(--line)}
.av.on{border-color:var(--green);background:var(--green-l);transform:translateY(-3px)}
.title .mapbg{z-index:0}.title .startcard{z-index:1}
.how{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left;font-size:18px;line-height:1.45}
.how li{display:flex;gap:10px;align-items:flex-start}.how i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
.node .nst{font-size:15px;background:rgba(255,255,255,.9);border-radius:999px;padding:0 8px}
.node .here{position:absolute;top:-34px;background:var(--red);color:#fff;font-family:'Jua',sans-serif;font-size:16px;border-radius:999px;padding:3px 12px;animation:bob 1s ease-in-out infinite;white-space:nowrap}
.node .here::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--red);border-bottom:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.cc{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid var(--line)}.cc.on{border-color:var(--green)}
.rtable{width:100%;border-collapse:collapse;margin-top:6px;font-size:15px}.rtable th,.rtable td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}.rtable th{background:var(--green-l)}
.gd{background:#fff;border-radius:12px;padding:8px 12px;margin-top:6px}.gd summary{cursor:pointer;font-family:'Jua',sans-serif;font-size:17px}.gd p,.gd ul{margin:4px 0;line-height:1.55;font-size:15px}
.tw{animation:twk 3s ease-in-out infinite}@keyframes twk{50%{opacity:.25}}
.ff{animation:ffly 5s ease-in-out infinite}@keyframes ffly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-18px);opacity:1}}
.spin{animation:sp 8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.node .lbl{color:var(--ink)}
/* ===== 아트 토이 스타일 : 파스텔 · 비닐 광택 · 블라인드 박스 ===== */
:root{
  --cream:#F6F1FF; --paper:#FFFFFF; --green:#1FC8A5; --green-d:#0E8F78; --green-l:#D7F7EE;
  --yellow:#FFC93C; --yellow-l:#FFF1BF; --orange:#FF8A4C; --red:#FF5C7A; --pink:#FF9EC0;
  --blue:#5AA9FF; --purple:#8F7BFF; --ink:#2B2540; --ink2:#6A6385; --line:#E4DCF5;
  --shadow:0 8px 0 rgba(143,123,255,.10),0 16px 30px rgba(110,90,180,.14);
}
html,body{background:radial-gradient(circle at 10% 6%,#FFE5F1 0,transparent 36%),radial-gradient(circle at 92% 10%,#DDF3FF 0,transparent 38%),radial-gradient(circle at 85% 96%,#FFF3C9 0,transparent 38%),#F6F1FF;color:var(--ink)}
.top{background:#fff;color:var(--ink);border-radius:0 0 28px 28px;box-shadow:0 6px 0 rgba(143,123,255,.14),0 10px 24px rgba(110,90,180,.12);padding:8px 18px}
.top::after{display:none}
#stage{margin-top:10px}

.modal{border-radius:32px;background:linear-gradient(180deg,#fff,#F8F4FF)}
.modal h2,.q-head h2{color:var(--purple)}

.mstrip b{color:var(--orange);font-family:'Jua',sans-serif;white-space:nowrap}.mstrip span:not(.pill){min-width:0;flex:1}
.q-head{flex-wrap:wrap}
.hbar{flex:0 0 auto;text-align:center;padding:8px 14px;background:linear-gradient(180deg,#EFE8FF,#E6DDFF);color:#5B49B8;font-size:15px;border-radius:22px 22px 0 0;box-shadow:0 -3px 10px rgba(110,90,180,.08)}
/* 지도의 블라인드 박스 노드 */

.node .lan::before{content:"";position:absolute;left:12px;top:8px;width:26px;height:9px;border-radius:99px;background:#fff;opacity:.65;transform:rotate(-18deg)}
.node.done .lan{background:linear-gradient(150deg,#fff,#F3ECFF);box-shadow:0 8px 0 #D8CCF5,0 14px 20px rgba(60,40,120,.2),0 0 26px 6px rgba(255,210,70,.7)}

.guide{filter:drop-shadow(0 6px 6px rgba(60,40,120,.2))}
.worldbar{background:#fff;border-top:0;border-radius:26px 26px 0 0;box-shadow:0 -6px 16px rgba(110,90,180,.12)}
.mapbox{margin:0 10px;border-radius:30px;box-shadow:0 8px 0 rgba(143,123,255,.15)}
.title .startcard{background:rgba(255,255,255,.92)}

/* 진열장 */
.cgrid.fig{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.ped .sil{filter:brightness(0) opacity(.18)}

/* 블라인드 박스 */
.bbstage{width:230px;height:210px;display:flex;align-items:center;justify-content:center;position:relative}
.bbox{width:150px;height:150px;border-radius:30px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 40%,#fff),var(--c));border:5px solid #fff;box-shadow:0 12px 0 color-mix(in srgb,var(--c) 70%,#000),0 20px 30px rgba(60,40,120,.3),inset 0 7px 0 rgba(255,255,255,.55);position:relative;display:flex;align-items:center;justify-content:center;animation:bob 2s ease-in-out infinite}
.bbox .q{font-family:'Jua',sans-serif;font-size:84px;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.bbox .lbl{position:absolute;bottom:8px;left:0;right:0;font-size:11px;letter-spacing:2px;color:#fff;opacity:.9;font-family:'Jua',sans-serif}
.bbox::before{content:"";position:absolute;left:0;right:0;top:50%;height:16px;margin-top:-8px;background:rgba(255,255,255,.35)}
.bbox.shake2{animation:shk2 .9s ease-in-out}
@keyframes shk2{10%{transform:rotate(-12deg)}25%{transform:rotate(12deg)}40%{transform:rotate(-14deg) scale(1.06)}55%{transform:rotate(14deg) scale(1.08)}75%{transform:rotate(-6deg) scale(1.12)}100%{transform:scale(1.3);opacity:0}}
.reveal{position:relative;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.tag2{position:absolute;left:-26px;top:6px;background:var(--purple);color:#fff;border-radius:999px;padding:2px 10px;font-family:'Jua',sans-serif;font-size:13px}
.new{position:absolute;right:-26px;top:0;background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-family:'Jua',sans-serif;font-size:14px;transform:rotate(10deg)}
.pill:empty{display:none}
/* ===== 마음 토이 월드 : 말랑 · 반짝 · 노을빛 동화 마을 ===== */
html,body{background:linear-gradient(#DDF1FF,#FFEAF4 60%,#FFF4D6)}
.top{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);margin:8px 10px 0;border-radius:999px;border:3px solid #fff;box-shadow:0 6px 0 rgba(143,123,255,.16),0 12px 24px rgba(110,90,180,.16)}

#stage{margin-top:8px}
.btn{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:.5px;border:3px solid #fff}
.btn.pop{background:linear-gradient(#FFE56B,#FFB92E);color:#6B3A00;border-radius:999px;box-shadow:inset 0 3px 0 rgba(255,255,255,.8),0 7px 0 #E08A0B,0 14px 22px rgba(224,138,11,.35)}
.btn.pop:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.8),0 2px 0 #E08A0B}
.card{border:3px solid #fff;box-shadow:0 8px 0 rgba(143,123,255,.12),0 16px 28px rgba(110,90,180,.14)}
.node .lan{width:92px;height:92px;border-radius:50%;border:5px solid #fff;
  background:radial-gradient(circle at 34% 26%,color-mix(in srgb,var(--c) 30%,#fff),var(--c) 62%,color-mix(in srgb,var(--c) 78%,#000));
  box-shadow:0 8px 0 color-mix(in srgb,var(--c) 65%,#000),0 16px 20px rgba(60,40,120,.3),0 0 0 6px rgba(255,255,255,.3),inset 0 -6px 10px rgba(0,0,0,.12)}
.node .lan::before{left:20px;top:11px;width:30px;height:13px;border-radius:99px;opacity:.8;transform:rotate(-24deg)}
.node .lbl{font-family:'Jua',sans-serif;background:#fff;border:3px solid color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#fff);border-radius:999px;padding:2px 14px;font-size:17px;color:var(--ink)}
.node.done .lan{background:radial-gradient(circle at 34% 26%,#fff,#FFF1B8);box-shadow:0 8px 0 #E8C75A,0 16px 20px rgba(60,40,120,.25),0 0 34px 12px rgba(255,214,90,.85)}
.mapbox{border:5px solid #fff;border-radius:34px;box-shadow:0 8px 0 rgba(143,123,255,.2),0 18px 30px rgba(110,90,180,.25)}
.worldbar{background:rgba(255,255,255,.95)}
.cl{animation:cdrift 60s linear infinite}
@keyframes cdrift{from{transform:translateX(-140px)}to{transform:translateX(1140px)}}
.wv{animation:bob 1.2s ease-in-out infinite}
.tw{animation:twk 3s ease-in-out infinite}@keyframes twk{50%{opacity:.25}}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fl2{position:absolute;font-style:normal;animation:flup 5s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(120,60,140,.3))}
@keyframes flup{0%,100%{transform:translate(0,0) rotate(-8deg);opacity:.85}50%{transform:translate(10px,-24px) rotate(10deg);opacity:1}}
.mapbox .floaters{z-index:1}
/* 타이틀 */
.title{background:#9C8FE8}
.hero{display:block;padding:0;overflow:hidden}
.hero .mapbg{z-index:0}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(90,40,120,.28) 100%),linear-gradient(rgba(60,30,120,.18),transparent 30%,transparent 70%,rgba(60,30,100,.25))}
.herotitle{position:absolute;left:0;right:0;top:3.5%;z-index:3;text-align:center;padding:0 12px}
.crest{display:inline-block;font-family:'Jua',sans-serif;color:#fff;background:linear-gradient(90deg,transparent,rgba(255,92,154,.92) 12%,rgba(255,92,154,.92) 88%,transparent);padding:4px 40px;font-size:clamp(13px,2vw,19px);letter-spacing:1px;text-shadow:0 2px 0 rgba(120,20,70,.4)}
.logo3d{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(46px,10.4vw,118px);line-height:1.08;margin:6px 0 8px;white-space:nowrap;
  -webkit-text-stroke:.11em #6B3412;paint-order:stroke fill;text-shadow:0 .07em 0 #6B3412,0 .16em 0 rgba(60,25,5,.35),0 .26em .3em rgba(60,20,90,.35)}
.logo3d .m1{color:#FF7BB0;display:inline-block;animation:bob 2.2s ease-in-out infinite;position:relative}
.logo3d .m1::after{content:"💗";position:absolute;right:-.5em;top:-.45em;font-size:.5em;-webkit-text-stroke:0;text-shadow:none;transform:rotate(14deg)}
.logo3d .m2{color:#FFD84D}
.ribbon{display:inline-block;font-family:'Jua',sans-serif;font-size:clamp(14px,2.2vw,22px);color:#6B3412;background:linear-gradient(#FFF6D8,#FFE3A0);padding:6px 38px;border:3px solid #fff;border-radius:12px;box-shadow:0 5px 0 #E3A94B,0 10px 14px rgba(80,30,100,.25);position:relative}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:8px;width:26px;height:100%;background:#FFC76B;z-index:-1;border:3px solid #fff}
.ribbon::before{left:-20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.ribbon::after{right:-20px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.mascot{position:absolute;bottom:6%;z-index:3;display:flex;flex-direction:column;align-items:center}
.mascot.l{left:max(2%,calc(50% - 560px))}.mascot.r{right:max(2%,calc(50% - 560px))}

.pedestal{width:210px;height:34px;margin-top:-22px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff,#FFD6EC 70%,#F0A9D0);box-shadow:0 10px 0 #D78BB8,0 18px 22px rgba(60,20,90,.35);z-index:-1;position:relative}
.mascot.r .pedestal{width:176px}
@media(max-width:700px){.mascot{display:none}}
.heroact{position:absolute;left:0;right:0;bottom:3.5%;z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px}
.heroact .btn.big{font-size:clamp(24px,3.6vw,36px);padding:14px 60px;animation:glowp 2s ease-in-out infinite}
@keyframes glowp{50%{filter:brightness(1.1) drop-shadow(0 0 14px rgba(255,220,90,.9))}}
.heroact .btn.w{background:rgba(255,255,255,.95)}
/* ===== 퀘스트 화면도 마음 토이 월드 ===== */
.screen:has(.quest){background:linear-gradient(#BFE6FF,#FFE0F0 55%,#FFF0C2)}
.quest{position:relative}
.quest::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 14%,rgba(255,158,192,.4),transparent 26%),radial-gradient(circle at 92% 20%,rgba(90,169,255,.32),transparent 28%),radial-gradient(circle at 84% 92%,rgba(255,224,100,.45),transparent 28%),radial-gradient(circle at 12% 88%,rgba(143,123,255,.3),transparent 28%)}
.quest>*{position:relative;z-index:1}
.quest>.floaters{position:absolute;z-index:0}
.q-head h2{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(22px,3vw,30px);color:#fff;-webkit-text-stroke:.2em #7A4BD8;paint-order:stroke fill;text-shadow:0 3px 0 #5B35B0}
.mstrip{background:linear-gradient(90deg,#FFF3C4,#FFE3F1);border:3px solid #fff;box-shadow:0 5px 0 rgba(143,123,255,.25)}
.hbar{background:linear-gradient(90deg,#FF9EC8,#B58CFF,#7CC4F5);color:#fff;text-shadow:0 2px 0 rgba(80,40,140,.45);font-family:'Jua',sans-serif;font-size:16px;border-radius:24px 24px 0 0}
.quest .card{background:linear-gradient(180deg,#fff,#FFF8FC);border:4px solid #fff;border-radius:30px;box-shadow:0 8px 0 rgba(143,123,255,.22),0 18px 30px rgba(110,90,180,.2)}
.quest [class*="grid"]>.card:nth-child(3n+1){background:linear-gradient(180deg,#FFF1F7,#fff)}
.quest [class*="grid"]>.card:nth-child(3n+2){background:linear-gradient(180deg,#EEF7FF,#fff)}
.quest [class*="grid"]>.card:nth-child(3n+3){background:linear-gradient(180deg,#FFF9DC,#fff)}
.quest .bubble{border-color:#7A4BD8;box-shadow:0 5px 0 rgba(122,75,216,.28);border-radius:26px}
.quest .dish,.quest .snd,.quest .se,.quest .tp,.quest .ing,.quest .temp,.quest .sauce,.quest .slot,.quest .cc{border-width:3px;box-shadow:0 5px 0 rgba(143,123,255,.2);transition:transform .12s,box-shadow .12s}
.quest .dish:hover,.quest .se:hover,.quest .ing:hover,.quest .sauce:hover,.quest .temp:hover,.quest .snd:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(143,123,255,.25)}
.quest .dish.on,.quest .se.on,.quest .sauce.on{box-shadow:0 0 0 4px rgba(255,200,60,.55),0 6px 0 rgba(143,123,255,.2)}
.quest .pill{background:#EFE3FF;color:#6B3FD0;border:2px solid #fff}
.quest .btn.g{background:linear-gradient(#FF9EC8,#FF5C9A);border-color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 6px 0 #D43A79,0 12px 18px rgba(212,58,121,.3)}
.quest .btn.g:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 2px 0 #D43A79}
.quest .offline{border-color:#FF9EC8;background:linear-gradient(135deg,#FFF3C4,#FFE0F0);border-radius:30px}
.quest .stepbar i.on{background:linear-gradient(90deg,#FF9EC8,#B58CFF)}
#plsvg{touch-action:none;user-select:none;-webkit-user-select:none}
.pit{cursor:grab;user-select:none;-webkit-user-select:none}.pit:active{cursor:grabbing}
.pit .selr{display:none}.pit.sel .selr{display:block}
.plwrap{width:min(100%,clamp(280px,calc(100vh - 400px),480px))}
.selbar{min-height:96px}
/* ===== 캐릭터 10종 · 요리 포즈 ===== */
.mascot{display:none}
.hero{display:flex;flex-direction:column;align-items:center}
.herotitle,.heroact,.cast{position:relative;left:auto;right:auto;top:auto;bottom:auto}
.herotitle{margin-top:1.8%;width:100%}
.logo3d{font-size:clamp(38px,min(9vw,14vh),108px)}
.crest{font-size:clamp(12px,1.6vw,17px)}
.ribbon{font-size:clamp(13px,1.8vw,20px);padding:4px 34px}
.heroact{margin-top:clamp(10px,2.2vh,22px);gap:10px;width:100%}
.heroact .btn.big{padding:10px 52px;font-size:clamp(22px,3.2vw,32px)}
.cast{margin-top:auto;width:100%;height:auto;padding:0 1.5% 8px;display:grid;grid-template-columns:repeat(10,1fr);align-items:end;pointer-events:none}
.cm{position:relative;display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;-webkit-user-select:none;user-select:none}
.cmfig svg{width:clamp(48px,min(9.4vw,19vh),160px);height:auto;filter:drop-shadow(0 8px 6px rgba(60,20,90,.3))}
.cm .pdst{width:92%;height:clamp(8px,1.8vh,16px);margin-top:calc(clamp(8px,1.8vh,16px)*-1.1);border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff,#FFD6EC 70%,#F0A9D0);box-shadow:0 5px 0 #D78BB8,0 10px 12px rgba(60,20,90,.3);z-index:-1;position:relative}
.cm .nm{font-family:'Jua',sans-serif;font-size:clamp(11px,1.25vw,16px);color:#7A4BD8;background:#fff;border-radius:999px;padding:0 10px;margin-top:6px;box-shadow:0 3px 0 rgba(122,75,216,.28);white-space:nowrap}
.cm .say{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%) scale(.6);opacity:0;background:#fff;border:3px solid #7A4BD8;border-radius:16px;padding:2px 10px;font-family:'Jua',sans-serif;font-size:clamp(11px,1.3vw,16px);color:#4A2A9A;white-space:nowrap;transition:all .18s;z-index:5;box-shadow:0 4px 0 rgba(122,75,216,.3)}
.cm .say.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.cm.hop .cmfig{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-22px) scale(1.06,.96)}60%{transform:translateY(0) scale(.97,1.04)}}
.cm:hover .cmfig{transform:translateY(-4px);transition:transform .15s}

.cm:nth-child(even){transform:translateY(-12px)}
@media(max-width:760px){.cm:nth-child(even){transform:none}}

/* 포즈 움직임 */
.an-wave{animation:pwave 1s ease-in-out infinite}@keyframes pwave{50%{transform:rotate(-16deg)}}
.an-flip{animation:pflip 1.6s ease-in-out infinite;transform-origin:144px 82px}@keyframes pflip{0%,100%{transform:translateY(8px) rotate(0)}50%{transform:translateY(-14px) rotate(25deg)}}

.castrow.front{z-index:2}

.cmfig svg,.castrow.back .cmfig svg{width:var(--fw)!important;height:auto}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='style'&&typeof v==='object'){for(const s in v){s.startsWith('--')?e.style.setProperty(s,v[s]):e.style[s]=v[s]}}
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

    try{this.d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){this.d=null}
    if(!this.d)this.d=this.def();

  },
  save(){try{localStorage.setItem(KEY,JSON.stringify(this.d))}catch(e){}},
  reset(){this.d=this.def();this.save()},
};

/* ---------- toast / modal ---------- */
function toast(msg,ms=2200){
  $$('.toast').forEach(t=>t.remove());
  const t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),ms);
}
function modal(content,{noclose=false}={}){
  const bg=h('div',{class:'modal-bg'});
  const m=h('div',{class:'modal pop'});
  m.append(content);bg.append(m);
  const close=()=>bg.remove();
  if(!noclose)bg.addEventListener('pointerdown',e=>{if(e.target===bg)close()});
  document.body.append(bg);
  return {close,el:m};
}

  const e=(x)=>`<ellipse cx="${x+dx}" cy="${cy+dy}" rx="${r*.85}" ry="${r}" fill="${INK}"/><circle cx="${x+dx+1.8}" cy="${cy+dy-2.4}" r="2.2" fill="#fff"/><circle cx="${x+dx-1.8}" cy="${cy+dy+2.4}" r="1" fill="#fff" opacity=".8"/>`;

}

    case 'blush':return eyes(L,R,cy,5.8)+blush(.8)+`<path d="M${cx-6} ${cy+12}q6 6 12 0" ${st}/>`;
    case 'think':return eyes(L,R,cy,5.8,3,-1)+`<path d="M${L-7} ${cy-11}q7 -4 14 0" ${st}/><path d="M${cx-5} ${cy+15}q6 -3 11 1" ${st}/>`;
    case 'wow':return eyes(L,R,cy,6.8)+`<ellipse cx="${cx}" cy="${cy+16}" rx="4.4" ry="6" fill="#E8486B" stroke="${INK}" stroke-width="2.6"/>`+blush(.5);
    default:return eyes(L,R,cy)+`<path d="M${cx-7} ${cy+11}q7 7 14 0" ${st}/>`+blush(.45);
  }
}

/* ---------- audio ---------- */
const Snd={
  ctx:null,
  get(){ if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); return this.ctx; },
  tone(f,t0,dur,type='sine',vol=.18,f2=null){
    if(this.mute)return;const c=this.get();if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+.05);
  },
  noise(t0,dur,{vol=.15,f0=2000,f1=null,q=1,type='bandpass'}={}){
    if(this.mute)return;const c=this.get();if(!c)return;
    const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource();s.buffer=b;
    const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);f.Q.value=q;
    const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f).connect(g).connect(c.destination);s.start(t0);
  },
  ping(){const c=this.get();if(!c)return;const t=c.currentTime;this.tone(660,t,.15,'triangle',.15);this.tone(990,t+.09,.2,'triangle',.15)},
  ok(){const c=this.get();if(!c)return;const t=c.currentTime;[523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*.09,.22,'triangle',.16))},
  bad(){const c=this.get();if(!c)return;const t=c.currentTime;this.tone(220,t,.25,'sawtooth',.08,140)},
  pop(){const c=this.get();if(!c)return;const t=c.currentTime;this.tone(400,t,.08,'sine',.15,800)},
  chime(){const c=this.get();if(!c)return;const t=c.currentTime;[784,988,1175,988,784].forEach((f,i)=>this.tone(f,t+i*.18,.4,'sine',.14))},
};

function confetti(n=90){
  const cv=h('canvas',{style:{position:'fixed',inset:0,width:'100%',height:'100%',zIndex:70,pointerEvents:'none'}});
  document.body.append(cv);cv.width=innerWidth;cv.height=innerHeight;
  const x=cv.getContext('2d');const cols=['#FFD84D','#00A67E','#F47A20','#FF8FAB','#4DA3E8','#8C6FD6'];
  const ps=Array.from({length:n},()=>({x:rnd(0,cv.width),y:rnd(-cv.height*.5,0),vx:rnd(-1.5,1.5),vy:rnd(2,5),r:rnd(5,10),c:pick(cols),a:rnd(0,6),va:rnd(-.2,.2)}));
  let f=0;(function loop(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<170)requestAnimationFrame(loop);else cv.remove()})();
}

const Timer={end:0,iv:null,
  start(min){this.stop();if(!min)return;this.end=Date.now()+min*60000;this.iv=setInterval(()=>this.tick(),1000);this.tick()},
  stop(){clearInterval(this.iv);this.iv=null;this.end=0;this.draw('')},
  tick(){
    const r=this.end-Date.now();
    if(r<=0){this.stop();Snd.chime();
      const c=h('div',{},h('h2',{},'⏰ 잠깐, 앱을 내려놓을 시간!'),
        h('p',{style:{fontSize:'18px',lineHeight:1.6}},'오늘 앱에서 한 활동을 짝에게 들려주세요. 화면 속 요리 말고, 내 진짜 마음도 한 줄 나눠 볼까요?'),
        h('div',{class:'row',style:{justifyContent:'flex-end'}},h('button',{class:'btn g',onclick:()=>m.close()},'알겠어요')));

/* ---------- canvas note card (PNG download) ---------- */
function wrapText(ctx,text,maxW){
  const lines=[];let cur='';
  for(const ch of text){ if(ch==='\n'){lines.push(cur);cur='';continue}
    if(ctx.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch}else cur+=ch }
  if(cur)lines.push(cur);return lines;
}
function noteCanvas(title,body,from,color='#00A67E'){
  const W=900,P=60,cv=document.createElement('canvas'),x=cv.getContext('2d');
  cv.width=W;cv.height=800;
  const font=(s,w='')=>`${w} ${s}px Jua,'Gowun Dodum','Noto Sans KR','Malgun Gothic',sans-serif`;
  x.font=font(34);const lines=wrapText(x,body,W-P*2-20);
  const H=Math.max(560,230+lines.length*52+130);cv.height=H;
  x.fillStyle='#FFFBE6';x.fillRect(0,0,W,H);
  x.fillStyle=color;x.fillRect(0,0,W,120);
  x.fillStyle='#fff';for(let i=0;i<W/50+1;i++){x.beginPath();x.arc(i*50,122,26,0,Math.PI);x.fillStyle=color;x.fill()}
  x.fillStyle='#fff';x.font=font(46);x.textBaseline='middle';x.fillText(title,P,62);
  x.fillStyle='#fff';x.strokeStyle='#E9DFC8';x.lineWidth=4;
  x.beginPath();x.roundRect(P-10,170,W-P*2+20,H-170-110,26);x.fill();x.stroke();
  x.fillStyle='#33291F';x.font=font(34);x.textBaseline='top';
  lines.forEach((l,i)=>x.fillText(l,P+14,200+i*52));
  x.fillStyle='#6B5E52';x.font=font(28);x.textAlign='right';x.fillText('from. '+(from||'나'),W-P,H-80);
  x.textAlign='left';x.fillStyle=color;x.font=font(22);x.fillText('마음 쿡쿡 요리단',P,H-48);
  return cv;
}
function saveCanvas(cv,name){
  try{const a=document.createElement('a');a.download=name+'.png';a.href=cv.toDataURL('image/png');document.body.append(a);a.click();a.remove()}catch(e){toast('저장이 막혀 있어요. 화면을 캡처해 주세요')}

function copyText(t){
  try{navigator.clipboard.writeText(t).then(()=>toast('복사했어요'),()=>toast('복사가 막혀 있어요'))}catch(e){toast('복사가 막혀 있어요')}
}

const MAX=5;

function evaluate(stack){
  const ty=stack.map(s=>s.type),c=t=>ty.filter(x=>x===t).length;
  const f=c('fact'),g=c('guess'),hs=c('heart'),a=c('ask'),n=ty.length;
  const askBottom=n>0&&ty[n-1]==='ask';
  const factFirst=ty[0]==='fact';
  const fi=ty.indexOf('fact'),hi=ty.indexOf('heart');
  const heartOk=hi===-1||(fi!==-1&&fi<hi);
  let lean=0;stack.forEach((p,i)=>{if(p.type==='guess')lean+=p.dir*(1+.15*(n-1-i))});
  const tilt=clamp(7*lean/(1+.25*f),-30,30);
  const amp=g?(2+6*Math.pow(g,1.4))/(1+.2*f+(askBottom?.4:0)):.8;
  const fell=Math.abs(tilt)+amp>24;
  const heat=Math.max(0,25*g+(a?0:20)+(f?0:20)-5*hs);
  let out='half';
  if(heat>=50)out='burnt';
  else if(heat<=15&&askBottom&&factFirst&&heartOk&&a>=1&&hs>=1&&f>=1)out='golden';
  return {f,g,hs,a,n,askBottom,factFirst,heartOk,tilt,amp,fell,heat,out};
}

function addPiece(pid,idx){

/* drag & drop (pointer based; tap = add / select) */
function startDrag(ev,pid,from,idx){
  if(st.phase!=='build')return;
  ev.preventDefault();
  const sx=ev.clientX,sy=ev.clientY;let ghost=null,moved=false;
  const p=st.pool.find(x=>x.id===pid);
  const mv=e=>{
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
    if(!moved){moved=true;ghost=h('div',{class:'ghost',html:shape(p.type,70)});document.body.append(ghost)}
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    const idx2=dropIndex(e.clientX,e.clientY);
    $$('.sp-piece').forEach(n=>n.classList.remove('dropbefore'));
    const col=$('#stackcol');if(col){col.classList.toggle('hot',idx2!=null)}
  };
  const up=e=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(ghost)ghost.remove();const col=$('#stackcol');if(col)col.classList.remove('hot');
    if(!moved){ // tap
      if(from==='tray'){const used=st.stack.findIndex(s=>s.pid===pid);if(used>=0){st.sel=used;refresh()}else addPiece(pid)}
      else{st.sel=(st.sel===idx?null:idx);Snd.pop();refresh()}
      return;
    }
    const di=dropIndex(e.clientX,e.clientY);
    if(from==='tray'){if(di!=null)addPiece(pid,di)}
    else{
      if(di==null){remove(idx)} // dragged off the skewer
      else{const it=st.stack.splice(idx,1)[0];const ni=di>idx?di-1:di;st.stack.splice(clamp(ni,0,st.stack.length),0,it);st.sel=clamp(ni,0,st.stack.length-1);Snd.pop();refresh()}
    }
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function dropIndex(x,y){
  const wrap=$('#skwrap');if(!wrap)return null;
  const r=wrap.getBoundingClientRect();
  if(x<r.left-30||x>r.right+30||y<r.top-30||y>r.bottom+30)return null;
  const nodes=$$('.sp-piece');
  let i=0;for(;i<nodes.length;i++){const b=nodes[i].getBoundingClientRect();if(y<b.top+b.height/2)break}
  return i;
}

/* skewer physics */
function startSim(){
  cancelAnimationFrame(st.raf);
  let last=performance.now();
  const loop=now=>{
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const sk=document.getElementById('skewer');if(!sk){return}
    const E=evaluate(st.stack);
    let target=E.fell?(E.tilt>=0?82:-82):E.tilt;
    const t=(now-st.t0)/1000;
    const wob=E.fell?0:E.amp*Math.sin(t*(2.2+E.g*.7))*.9;
    const k=E.fell?18:60,c=E.fell?4:5.5;
    const acc=-k*(st.th-(target+wob))-c*st.om;
    st.om+=acc*dt;st.th+=st.om*dt;
    sk.style.transform=`rotate(${st.th}deg)`;
    const fm=document.getElementById('fellmsg');if(fm)fm.style.display=E.fell?'':'none';
    st.raf=requestAnimationFrame(loop);
  };
  st.raf=requestAnimationFrame(loop);
}
